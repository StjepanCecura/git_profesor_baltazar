version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "devel"

    allow:
      - dependency-type: "direct"

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    open-pull-requests-limit: 5
